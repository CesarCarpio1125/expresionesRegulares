services:
  - type: web
    name: regexlab
    region: oregon
    env: php
    buildCommand: "composer install --no-dev --prefer-dist && npm ci --legacy-peer-deps && npm run build && php artisan config:cache && php artisan optimize"
    startCommand: "php artisan serve --host=0.0.0.0 --port=$PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: "null"
      - key: DB_DATABASE
        value: "null"
      - key: PHP_VERSION
        value: "8.2"
      - key: APP_URL
        value: "https://regexlab.onrender.com"
    autoDeploy: true