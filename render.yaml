services:
  - type: web
    name: regexlab
    env: docker
    region: oregon
    buildCommand: |
      composer install --optimize-autoloader --no-dev
      npm ci && npm run build
      php artisan optimize
    startCommand: apache2-foreground
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false